<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語漢字単語カード</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Noto Sans JP",sans-serif;}
body{background:#f7f8fa;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;}

/* カード3D反転 */
.flip-container{perspective:1200px;width:700px;height:480px;cursor:pointer;}
.flipper{position:relative;width:100%;height:100%;transition:transform 0.6s ease;transform-style:preserve-3d;}
.flip-container.flipped .flipper{transform:rotateY(180deg);}
.card-front,.card-back{
  position:absolute;width:100%;height:100%;backface-visibility:hidden;
  border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px;box-shadow:0 6px 22px rgba(0,0,0,0.18);
}
.card-front{background:#ffffff;color:#111;}
.card-back{background:#234896;color:#fff;transform:rotateY(180deg);}

/* 文字サイズ 投影最適化 */
.main-text{font-size:80px;font-weight:bold;margin-bottom:24px;}
.sub-text{font-size:40px;margin:8px 0;}
.note-text{font-size:36px;margin-top:14px;opacity:0.98;}
.hint{font-size:18px;color:#777;margin-top:16px;}

/* 操作ボタンを最前面、クリック干渉防止 */
.mode-bar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;position:relative;z-index:100;}
.controls{display:flex;gap:16px;position:relative;z-index:100;}
button{
  padding:12px 22px;font-size:19px;border:none;border-radius:9px;
  background:#234896;color:#fff;cursor:pointer;
  transition:0.2s;
  position:relative;z-index:200;
}
button.mode-active{background:#1976D2;}
button#shuffle{background:#238259;}
button:active{opacity:0.85;}
.info{position:absolute;bottom:18px;color:#666;font-size:16px;}
</style>
</head>
<body>

<div class="mode-bar">
  <button id="mode1" class="mode-active">モード1：漢字→読み・意味</button>
  <button id="mode2">モード2：読み→漢字・意味</button>
  <button id="mode3">モード3：意味→漢字・読み</button>
</div>

<div class="flip-container" id="cardWrap">
  <div class="flipper">
    <div class="card-front">
      <div class="main-text" id="frontMain"></div>
      <div class="hint">クリックで答えを表示</div>
    </div>
    <div class="card-back">
      <div class="main-text" id="backMain"></div>
      <div class="sub-text" id="backKana"></div>
      <div class="note-text" id="backEng"></div>
    </div>
  </div>
</div>

<div class="controls">
  <button id="prev">← 前へ</button>
  <button id="next">次へ →</button>
  <button id="shuffle">シャッフル</button>
</div>

<div class="info">Space：カード反転｜←→キー：単語移動</div>

<script>

const wordList = [

  {kanji:"単位",kana:"たんい",eng:"unit, credit"},
  {kanji:"文法",kana:"ぶんぽう",eng:"grammar"},
  {kanji:"方法",kana:"ほうほう",eng:"method, way"},
  {kanji:"法学部",kana:"ほうがくぶ",eng:"law department"},
  {kanji:"難しい",kana:"むずかしい",eng:"difficult"},
  {kanji:"困難な",kana:"こんなんな",eng:"difficult, troublesome"},
  {kanji:"簡単な",kana:"かんたんな",eng:"easy, simple"},

  {kanji:"歴史",kana:"れきし",eng:"history"},

  {kanji:"変化する",kana:"へんかする",eng:"to change"},
  {kanji:"変な",kana:"へんな",eng:"strange"},
  {kanji:"大変な",kana:"たいへんな",eng:"very, serious"},
  {kanji:"化学",kana:"かがく",eng:"chemistry"},

  {kanji:"化粧する",kana:"けしょうする",eng:"to apply makeup, cosmetics"},

  {kanji:"比較する",kana:"ひかくする",eng:"to compare"},

  {kanji:"形",kana:"かたち",eng:"shape, model"},
  {kanji:"人形",kana:"にんぎょう",eng:"doll"},
  {kanji:"三角形",kana:"さんかくけい",eng:"triangle"},
  {kanji:"四角形",kana:"しかくけい",eng:"square"},
  {kanji:"解答する",kana:"かいとうする",eng:"to answer"},
  {kanji:"正答",kana:"せいとう",eng:"correct answer"},

  {kanji:"備える",kana:"そなえる",eng:"to prepare"},
  {kanji:"設備",kana:"せつび",eng:"equipment, installation"},

  {kanji:"数学",kana:"すうがく",eng:"mathematics"},
  {kanji:"数量",kana:"すうりょう",eng:"quantity"},

  {kanji:"数か月",kana:"すうかげつ",eng:"several months"},
  {kanji:"人数",kana:"にんずう",eng:"amount (of people)"},
  {kanji:"販売する",kana:"はんばいする",eng:"to sell"},
  {kanji:"自動販売機",kana:"じどうはんばいき",eng:"vending machine"},
  {kanji:"値段",kana:"ねだん",eng:"price"},
  {kanji:"値上げする",kana:"ねあげする",eng:"to raise the price"},
  {kanji:"値下げする",kana:"ねさげする",eng:"to lower the price"},
  {kanji:"価値",kana:"かち",eng:"value, worth"},
  {kanji:"内容",kana:"ないよう",eng:"contents"},
  {kanji:"容器",kana:"ようき",eng:"container"},
  {kanji:"美容",kana:"びよう",eng:"beautiful form"},
  {kanji:"美容院",kana:"びよういん",eng:"beauty salon"},
  {kanji:"容易な",kana:"よういな",eng:"easy, simple"},
];

let wordData = [...wordList];
let currentIndex = 0;
const MODES = {
  KANJI_TO_READ:1,
  READ_TO_KANJI:2,
  ENG_TO_KANJI:3
};
let currentMode = MODES.KANJI_TO_READ;
let isBusy = false;

const cardWrap = document.getElementById("cardWrap");
const frontMain = document.getElementById("frontMain");
const backMain = document.getElementById("backMain");
const backKana = document.getElementById("backKana");
const backEng = document.getElementById("backEng");

// カード描画
function renderCard(){
  const item = wordData[currentIndex];
  cardWrap.classList.remove("flipped");
  switch(currentMode){
    case MODES.KANJI_TO_READ:
      frontMain.textContent = item.kanji;
      backMain.textContent = item.kanji;
      backKana.textContent = item.kana;
      backEng.textContent = item.eng;
      break;
    case MODES.READ_TO_KANJI:
      frontMain.textContent = item.kana;
      backMain.textContent = item.kanji;
      backKana.textContent = item.kana;
      backEng.textContent = item.eng;
      break;
    case MODES.ENG_TO_KANJI:
      frontMain.textContent = item.eng;
      backMain.textContent = item.kanji;
      backKana.textContent = item.kana;
      backEng.textContent = item.eng;
      break;
  }
}

// シャッフル
function shuffleArray(arr){
  const copy = [...arr];
  for(let i = copy.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]] = [copy[j],copy[i]];
  }
  return copy;
}
function startShuffle(){
  wordData = shuffleArray(wordList);
  currentIndex = 0;
  renderCard();
}

// 前へ・次へ
function nextWord() {
  if(isBusy) return;
  isBusy = true;
  currentIndex = (currentIndex + 1) % wordData.length;
  renderCard();
  setTimeout(()=>{isBusy = false},300);
}
function prevWord() {
  if(isBusy) return;
  isBusy = true;
  currentIndex = (currentIndex - 1 + wordData.length) % wordData.length;
  renderCard();
  setTimeout(()=>{isBusy = false},300);
}

// イベント登録
cardWrap.addEventListener("click", (e)=>{
  e.stopPropagation();
  cardWrap.classList.toggle("flipped");
});

document.getElementById("next").addEventListener("click",(e)=>{
  e.stopPropagation();
  nextWord();
});
document.getElementById("prev").addEventListener("click",(e)=>{
  e.stopPropagation();
  prevWord();
});
document.getElementById("shuffle").addEventListener("click",(e)=>{
  e.stopPropagation();
  startShuffle();
});

// モード切替
const modeButtons = [
  {el:document.getElementById("mode1"),mode:MODES.KANJI_TO_READ},
  {el:document.getElementById("mode2"),mode:MODES.READ_TO_KANJI},
  {el:document.getElementById("mode3"),mode:MODES.ENG_TO_KANJI}
];
modeButtons.forEach(btn=>{
  btn.el.addEventListener("click",(e)=>{
    e.stopPropagation();
    currentMode = btn.mode;
    modeButtons.forEach(b=>b.el.classList.remove("mode-active"));
    btn.el.classList.add("mode-active");
    renderCard();
  })
});

// キーボード操作
document.addEventListener("keydown",e=>{
  if(isBusy) return;
  if(e.code === "Space"){
    e.preventDefault();
    cardWrap.classList.toggle("flipped");
  }else if(e.code === "ArrowRight"){
    nextWord();
  }else if(e.code === "ArrowLeft"){
    prevWord();
  }
});

// 初期起動
startShuffle();
</script>
</body>
</html>
