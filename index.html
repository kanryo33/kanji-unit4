<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語漢字単語カード</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Noto Sans JP",sans-serif;}
body{background:#f7f8fa;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;}

/* カード3D反転 */
.flip-container{perspective:1200px;width:700px;height:480px;cursor:pointer;}
.flipper{position:relative;width:100%;height:100%;transition:transform 0.6s ease;transform-style:preserve-3d;}
.flip-container.flipped .flipper{transform:rotateY(180deg);}
.card-front,.card-back{
  position:absolute;width:100%;height:100%;backface-visibility:hidden;
  border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px;box-shadow:0 6px 22px rgba(0,0,0,0.18);
}
.card-front{background:#ffffff;color:#111;}
.card-back{background:#234896;color:#fff;transform:rotateY(180deg);}

/* 文字サイズ 投影最適化 */
.main-text{font-size:80px;font-weight:bold;margin-bottom:12px;}
.sub-text{font-size:40px;margin:6px 0;}
.note-text{font-size:34px;margin:6px 0;opacity:0.98;}
.cn-text{font-size:32px;margin-top:8px;color:#ffe89c;}
.hint{font-size:18px;color:#777;margin-top:16px;}

/* 操作ボタンを最前面、クリック干渉防止 */
.mode-bar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;position:relative;z-index:100;}
.controls{display:flex;gap:16px;position:relative;z-index:100;}
button{
  padding:12px 22px;font-size:19px;border:none;border-radius:9px;
  background:#234896;color:#fff;cursor:pointer;
  transition:0.2s;
  position:relative;z-index:200;
}
button.mode-active{background:#1976D2;}
button#shuffle{background:#238259;}
button:active{opacity:0.85;}
.info{position:absolute;bottom:18px;color:#666;font-size:16px;}
</style>
</head>
<body>

<div class="mode-bar">
  <button id="mode1" class="mode-active">モード1：漢字→読み・意味</button>
  <button id="mode2">モード2：読み→漢字・意味</button>
  <button id="mode3">モード3：英語→漢字・読み</button>
</div>

<div class="flip-container" id="cardWrap">
  <div class="flipper">
    <div class="card-front">
      <div class="main-text" id="frontMain"></div>
      <div class="hint">クリックで答えを表示</div>
    </div>
    <div class="card-back">
      <div class="main-text" id="backMain"></div>
      <div class="sub-text" id="backKana"></div>
      <div class="note-text" id="backEng"></div>
      <div class="cn-text" id="backCn"></div>
    </div>
  </div>
</div>

<div class="controls">
  <button id="prev">← 前へ</button>
  <button id="next">次へ →</button>
  <button id="shuffle">シャッフル</button>
</div>

<div class="info">Space：カード反転｜←→キー：単語移動</div>

let wordData = [...wordList];
let currentIndex = 0;
const MODES = {
  KANJI_TO_READ:1,
  READ_TO_KANJI:2,
  ENG_TO_KANJI:3
};
let currentMode = MODES.KANJI_TO_READ;
let isBusy = false;

const cardWrap = document.getElementById("cardWrap");
const frontMain = document.getElementById("frontMain");
const backMain = document.getElementById("backMain");
const backKana = document.getElementById("backKana");
const backEng = document.getElementById("backEng");
const backCn = document.getElementById("backCn");

// カード描画（追加中文渲染）
function renderCard(){
  const item = wordData[currentIndex];
  cardWrap.classList.remove("flipped");
  switch(currentMode){
    case MODES.KANJI_TO_READ:
      frontMain.textContent = item.kanji;
      backMain.textContent = item.kanji;
      backKana.textContent = item.kana;
      backEng.textContent = item.eng;
      backCn.textContent = item.cn;
      break;
    case MODES.READ_TO_KANJI:
      frontMain.textContent = item.kana;
      backMain.textContent = item.kanji;
      backKana.textContent = item.kana;
      backEng.textContent = item.eng;
      backCn.textContent = item.cn;
      break;
    case MODES.ENG_TO_KANJI:
      frontMain.textContent = item.eng;
      backMain.textContent = item.kanji;
      backKana.textContent = item.kana;
      backEng.textContent = item.eng;
      backCn.textContent = item.cn;
      break;
  }
}

// シャッフル
function shuffleArray(arr){
  const copy = [...arr];
  for(let i = copy.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]] = [copy[j],copy[i]];
  }
  return copy;
}
function startShuffle(){
  wordData = shuffleArray(wordList);
  currentIndex = 0;
  cardWrap.classList.remove("flipped");
  renderCard();
}

// 翻页前强制复位卡片到正面，解决背面闪现问题
function goNextWord() {
  if(isBusy) return;
  isBusy = true;
  // 先翻回正面
  cardWrap.classList.remove("flipped");
  // 等待翻转结束再切换内容
  setTimeout(()=>{
    currentIndex = (currentIndex + 1) % wordData.length;
    renderCard();
    setTimeout(()=>{isBusy = false},200);
  },300);
}
function goPrevWord() {
  if(isBusy) return;
  isBusy = true;
  // 先翻回正面
  cardWrap.classList.remove("flipped");
  setTimeout(()=>{
    currentIndex = (currentIndex - 1 + wordData.length) % wordData.length;
    renderCard();
    setTimeout(()=>{isBusy = false},200);
  },300);
}

// イベント登録
cardWrap.addEventListener("click", (e)=>{
  e.stopPropagation();
  cardWrap.classList.toggle("flipped");
});

document.getElementById("next").addEventListener("click",(e)=>{
  e.stopPropagation();
  goNextWord();
});
document.getElementById("prev").addEventListener("click",(e)=>{
  e.stopPropagation();
  goPrevWord();
});
document.getElementById("shuffle").addEventListener("click",(e)=>{
  e.stopPropagation();
  startShuffle();
});

// モード切替
const modeButtons = [
  {el:document.getElementById("mode1"),mode:MODES.KANJI_TO_READ},
  {el:document.getElementById("mode2"),mode:MODES.READ_TO_KANJI},
  {el:document.getElementById("mode3"),mode:MODES.ENG_TO_KANJI}
];
modeButtons.forEach(btn=>{
  btn.el.addEventListener("click",(e)=>{
    e.stopPropagation();
    currentMode = btn.mode;
    modeButtons.forEach(b=>b.el.classList.remove("mode-active"));
    btn.el.classList.add("mode-active");
    cardWrap.classList.remove("flipped");
    renderCard();
  })
});

// キーボード操作
document.addEventListener("keydown",e=>{
  if(isBusy) return;
  if(e.code === "Space"){
    e.preventDefault();
    cardWrap.classList.toggle("flipped");
  }else if(e.code === "ArrowRight"){
    goNextWord();
  }else if(e.code === "ArrowLeft"){
    goPrevWord();
  }
});

// 初期起動
startShuffle();
</script>
</body>
</html>
